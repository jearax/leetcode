plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'

	// Lint + format
	id 'com.diffplug.spotless' version '7.2.1'
	id 'checkstyle'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ── Format: Spotless (Eclipse formatter, tab 2-space) ─────────────────
// ./gradlew spotlessApply → format lại file; ./gradlew spotlessCheck → chỉ kiểm tra
// Cùng 1 config/eclipse-java-format.xml với .vscode/settings.json →
// format-on-save trong VS Code ra output y hệt Spotless.
spotless {
	java {
		eclipse().configFile('config/eclipse-java-format.xml')
		removeUnusedImports()
		importOrder('java', 'javax', 'org', 'com', '')
	}
}

// ── Lint: Checkstyle ──────────────────────────────────────────────────
// Tự chạy trong `./gradlew build` (task check). Rules ở config/checkstyle/checkstyle.xml
checkstyle {
	toolVersion = '10.21.4'
	configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}
