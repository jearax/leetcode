# Gradle 9 rich console vẽ lại dòng "waiting for changes" trong --continuous
# và đè mất output phía trên → plain console in như terminal bình thường.
org.gradle.console=plain

# Google Java Format (Spotless) crash trên daemon JDK 25 (NoSuchMethodError
# trong javac internals) → pin daemon về JDK 21 LTS. Code vẫn compile bằng
# toolchain 25. Đổi path nếu JDK 21 nằm chỗ khác.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
