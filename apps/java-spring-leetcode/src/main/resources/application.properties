# Application name
spring.application.name=java-spring-leetcode

# Tắt cái banner SPRING ASCII art
spring.main.banner-mode=off

# Bớt ồn (INFO là default). Lưu ý: KHÔNG set logging.level.com.jjuidev=DEBUG
# nếu không muốn log startup của app hiện lại — logger của app cụ thể hơn
# root nên sẽ override WARN này.
logging.level.root=WARN
